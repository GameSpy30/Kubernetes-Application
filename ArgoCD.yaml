apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: argocd   #ArgoCD runs here
spec:
  project: default

  source:
    repoURL: https://github.com/your-repo/eks-platform
    targetRevision: HEAD
    path: helm/my-app

    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: my-app-namespace   #target namespace

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true   #THIS creates namespace automatically